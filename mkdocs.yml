site_name: LoTusY
site_description: 从深度学习基础到具身智能，记录论文阅读、代码实践与每天的新发现。
site_url: https://jxtzz.github.io/
site_author: LoTusY
site_dir: .build/site
exclude_docs: |
  /journal/idea/
  /journal/2026-10-27.md
  /papers/human-depth-ambiguity.md
hooks:
  - scripts/site_hooks.py
repo_url: https://github.com/JXTZZ/JXTZZ.github.io
repo_name: JXTZZ / Notes
copyright: Copyright &copy; 2026 LoTusY · 保持好奇，持续记录。
theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/version-sync.js
extra:
  site_version: !ENV [GITHUB_SHA, local]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JXTZZ
      name: LoTusY on GitHub
